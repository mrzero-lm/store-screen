name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Write app files
        run: |
          mkdir -p app/src/main/assets app/src/main/res/drawable app/src/main/java/com/storescreen/player

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.storescreen.player"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.storescreen.player"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <application
                  android:label="Store Screen"
                  android:icon="@drawable/ic_launcher"
                  android:banner="@drawable/banner"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape"
                      android:configChanges="orientation|screenSize|keyboardHidden|keyboard|navigation|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/storescreen/player/MainActivity.kt <<'EOF'
          package com.storescreen.player

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.os.Bundle
          import android.view.KeyEvent
          import android.view.View
          import android.view.WindowManager
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import java.io.ByteArrayInputStream

          class MainActivity : Activity() {

              private lateinit var web: WebView
              private val host = "com.storescreen.player"

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)

                  web = WebView(this)
                  web.setBackgroundColor(0xFF000000.toInt())
                  setContentView(web)

                  with(web.settings) {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      mediaPlaybackRequiresUserGesture = false
                      mixedContentMode = WebSettings.MIXED_CONTENT_NEVER_ALLOW
                  }
                  web.webChromeClient = WebChromeClient()
                  web.webViewClient = object : WebViewClient() {
                      override fun shouldInterceptRequest(
                          view: WebView?,
                          request: WebResourceRequest?
                      ): WebResourceResponse? {
                          val uri = request?.url ?: return null
                          if (uri.host != host) return null
                          var path = (uri.path ?: "").trimStart('/')
                          if (path.isEmpty()) path = "index.html"
                          return try {
                              WebResourceResponse(mimeFor(path), "utf-8", assets.open(path))
                          } catch (e: Exception) {
                              WebResourceResponse(
                                  "text/plain", "utf-8", 404, "Not Found",
                                  emptyMap(), ByteArrayInputStream(ByteArray(0))
                              )
                          }
                      }
                  }
                  web.loadUrl("https://$host/index.html")
              }

              private fun mimeFor(path: String): String =
                  when (path.substringAfterLast('.', "").lowercase()) {
                      "html" -> "text/html"
                      "json" -> "application/json"
                      "png" -> "image/png"
                      "jpg", "jpeg" -> "image/jpeg"
                      "js" -> "application/javascript"
                      "css" -> "text/css"
                      else -> "application/octet-stream"
                  }

              @Suppress("DEPRECATION")
              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) {
                      window.decorView.systemUiVisibility = (View.SYSTEM_UI_FLAG_FULLSCREEN
                              or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                              or View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                              or View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                              or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                              or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN)
                  }
              }

              override fun onKeyDown(keyCode: Int, event: KeyEvent?): Boolean {
                  val js = when (keyCode) {
                      KeyEvent.KEYCODE_DPAD_RIGHT -> "window.nextItem && nextItem()"
                      KeyEvent.KEYCODE_DPAD_UP -> "window.adBreakNow && adBreakNow()"
                      KeyEvent.KEYCODE_DPAD_DOWN -> "window.toggleDemo && toggleDemo()"
                      else -> null
                  }
                  if (js != null) {
                      web.evaluateJavascript(js, null)
                      return true
                  }
                  return super.onKeyDown(keyCode, event)
              }

              override fun onResume() {
                  super.onResume()
                  web.onResume()
              }

              override fun onPause() {
                  web.onPause()
                  super.onPause()
              }

              override fun onDestroy() {
                  web.destroy()
                  super.onDestroy()
              }
          }
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="96dp"
              android:height="96dp"
              android:viewportWidth="96"
              android:viewportHeight="96">
              <path android:fillColor="#00A651" android:pathData="M0,0h96v96h-96z" />
              <path android:fillColor="#FFFFFF" android:pathData="M38,28L70,48L38,68Z" />
          </vector>
          EOF

          cat > app/src/main/res/drawable/banner.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="320dp"
              android:height="180dp"
              android:viewportWidth="320"
              android:viewportHeight="180">
              <path android:fillColor="#00A651" android:pathData="M0,0h320v180h-320z" />
              <path android:fillColor="#FFFFFF" android:pathData="M130,60L200,90L130,120Z" />
          </vector>
          EOF

          cat > app/src/main/assets/config.json <<'EOF'
          {
            "adEverySec": 900,
            "demoAdEverySec": 45,
            "caps": { "highlight": 90, "tip": 60, "ad": 45 },
            "highlights": [
              "HGSSWkl1tIw",
              "RCtA1NtgjAs",
              "Ll8C_46jHok",
              "g4VJOmXMH1w",
              "XBAo5qIqgmU",
              "ABQ9-5vAH6k",
              "sgVLzrpITk4",
              "CrmcvrbsR1g",
              "RnaLPRUsj5k"
            ],
            "ads": [
              "6L951Wh61ss"
            ],
            "tips": [],
            "tipsPlaylist": "UUHU4R49ZCZ9MXE_FUk5FMdA"
          }
          EOF

          cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Store screen</title>
          <style>
          :root{--green:#00a651;--ink:#06100a;--muted:#a9bfb1}
          html,body{height:100%;margin:0;background:#000;overflow:hidden;font-family:system-ui,Roboto,Arial,sans-serif;color:#fff;cursor:none}
          #stage{position:absolute;inset:0}
          .slide{position:absolute;inset:0;opacity:0;transition:opacity .7s;background:#000}
          .slide.on{opacity:1}
          .slide div,.slide iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
          .slide.card{display:flex;flex-direction:column;justify-content:center;padding:0 9vw;background:radial-gradient(ellipse at 75% 25%,#14361f,var(--ink) 65%)}
          .card h1{font-size:6vw;margin:0 0 2vh;max-width:62vw;line-height:1.05}
          .card p{font-size:2.6vw;margin:0;color:var(--muted);max-width:58vw;line-height:1.35}
          #seg{position:fixed;top:3vh;left:3vw;z-index:6;font-size:1.7vw;font-weight:600;background:rgba(0,0,0,.6);padding:.7vh 1.3vw;border-radius:99px;transition:opacity .6s}
          #logo{position:fixed;right:3vw;bottom:5vh;z-index:6}
          #logo img{width:14vw;display:block}
          #logo.txt{background:rgba(0,0,0,.7);padding:1vh 1.6vw;border-radius:8px;font-weight:800;font-size:1.9vw;letter-spacing:.06em}
          #logo.txt b{color:var(--green)}
          #bar{position:fixed;left:0;right:0;bottom:0;height:.7vh;background:#16281d;z-index:6}
          #fill{height:100%;width:0;background:var(--green)}
          #info{position:fixed;left:3vw;bottom:2.2vh;z-index:6;font-size:1.3vw;color:var(--muted);text-shadow:0 1px 6px #000}
          </style>
          </head>
          <body>
          <div id="seg"></div>
          <div id="logo"><img src="logo.png" alt="O’Reilly Auto Parts" onerror="var l=this.parentNode;l.className='txt';l.innerHTML='<b>O’REILLY</b> AUTO PARTS'"></div>
          <div id="stage"></div>
          <div id="bar"><div id="fill"></div></div>
          <div id="info"></div>
          <script>
          var cfg = { adEverySec: 900, demoAdEverySec: 45, caps: { highlight: 90, tip: 60, ad: 45 }, highlights: [], ads: [], tips: [], tipsPlaylist: "" };
          var every = 900, lastAd = Date.now(), timer = null, turn = 0, hi = 0, ti = 0, queue = [], demo = false;
          var player = null, uid = 0, ytReady = false, started = false, errMsg = "", errUntil = 0;
          var HL = [], AD = [], TP = [];
          var stage = document.getElementById("stage"), fill = document.getElementById("fill"),
              seg = document.getElementById("seg"), info = document.getElementById("info");

          function toId(s){ var m = String(s).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/); return m ? m[1] : String(s).trim(); }
          function items(arr, type){ return (arr || []).map(function(s){ return { type: type, yt: toId(s), dur: cfg.caps[type] }; }); }
          function shuffle(a){ for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

          function pick(){
            if (queue.length) return queue.shift();
            if ((Date.now() - lastAd) / 1000 >= every) { lastAd = Date.now(); queue = AD.length > 1 ? [AD[1]] : []; return AD[0]; }
            return (turn++ % 2 === 0) ? HL[hi++ % HL.length] : TP[ti++ % TP.length];
          }
          function killPlayer(){ try { if (player) player.destroy(); } catch (x) {} player = null; }

          function build(it, live){
            var d = document.createElement("div");
            if (live) {
              d.className = "slide";
              var id = "yt" + (++uid);
              d.innerHTML = '<div id="' + id + '"></div>';
              setTimeout(function(){
                killPlayer();
                var c = { playerVars: { autoplay: 1, controls: 0, rel: 0, modestbranding: 1, playsinline: 1, origin: location.origin },
                  events: {
                    onReady: function(e){ e.target.playVideo(); },
                    onStateChange: function(e){ if (e.data === 0) next(); },
                    onError: function(e){ errMsg = "Skipped a video (YouTube error " + e.data + ")"; errUntil = Date.now() + 6000; next(); }
                  } };
                if (it.yt) c.videoId = it.yt;
                else { c.playerVars.listType = "playlist"; c.playerVars.list = it.list; c.playerVars.index = Math.floor(Math.random() * 40); }
                player = new YT.Player(id, c);
              }, 50);
              return d;
            }
            d.className = "slide card";
            d.innerHTML = '<h1>' + (it.title || "Video unavailable") + '</h1><p>' + (it.sub || "Check the internet connection and the links in config.json.") + '</p>';
            return d;
          }

          function next(){
            clearTimeout(timer);
            var it = pick(), live = !!((it.yt || it.list) && ytReady), dur = live ? it.dur : 8;
            var el = build(it, live), old = stage.firstChild;
            stage.appendChild(el);
            void el.offsetWidth; el.className += " on";
            if (old) { old.className = old.className.replace(" on", ""); setTimeout(function(){ if (old.parentNode) old.parentNode.removeChild(old); }, 800); }
            seg.textContent = it.type === "ad" ? "Ad break" : it.type === "tip" ? "Garage tips" : "Race highlights";
            seg.style.opacity = 1; setTimeout(function(){ seg.style.opacity = 0; }, 5000);
            fill.style.transition = "none"; fill.style.width = "0"; void fill.offsetWidth;
            fill.style.transition = "width " + dur + "s linear"; fill.style.width = "100%";
            timer = setTimeout(next, dur * 1000);
          }

          function tick(){
            if (Date.now() < errUntil) { info.textContent = errMsg; return; }
            if (!demo) { info.textContent = ""; return; }
            var left = Math.max(0, Math.round(every - (Date.now() - lastAd) / 1000));
            info.textContent = "Demo speed. Next ad break in " + Math.floor(left / 60) + ":" + ("0" + (left % 60)).slice(-2);
          }

          window.nextItem = next;
          window.adBreakNow = function(){ lastAd = 0; next(); };
          window.toggleDemo = function(){ demo = !demo; every = demo ? cfg.demoAdEverySec : cfg.adEverySec; lastAd = Date.now(); };

          function startNow(){
            if (started) return;
            started = true;
            next();
          }

          function boot(){
            every = cfg.adEverySec;
            HL = shuffle(items(cfg.highlights, "highlight"));
            AD = items(cfg.ads, "ad");
            TP = (cfg.tips && cfg.tips.length) ? items(cfg.tips, "tip")
               : cfg.tipsPlaylist ? [{ type: "tip", list: cfg.tipsPlaylist, dur: cfg.caps.tip }] : [];
            if (!HL.length) HL = [{ type: "highlight", title: "Race highlights", sub: "Add video links to config.json." }];
            if (!AD.length) AD = [{ type: "ad", title: "O’Reilly Auto Parts", sub: "Add commercial links to config.json." }];
            if (!TP.length) TP = [{ type: "tip", title: "Garage tips", sub: "Add tip video links to config.json." }];
            window.onYouTubeIframeAPIReady = function(){ ytReady = true; startNow(); };
            var s = document.createElement("script");
            s.src = "https://www.youtube.com/iframe_api";
            s.onerror = startNow;
            document.head.appendChild(s);
            setTimeout(startNow, 8000);
            setInterval(tick, 1000);
          }

          fetch("config.json").then(function(r){ return r.json(); }).catch(function(){ return {}; }).then(function(c){
            for (var k in c) cfg[k] = c[k];
            boot();
          });
          </script>
          </body>
          </html>
          EOF

          [ -f logo.png ] && cp logo.png app/src/main/assets/logo.png || true
          [ -f config.json ] && cp config.json app/src/main/assets/config.json || true

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk store-screen.apk

      - uses: actions/upload-artifact@v4
        with:
          name: store-screen-apk
          path: store-screen.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: store-screen.apk
