<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>O'Reilly Auto Parts Racing Channel</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            font-family: sans-serif;
            color: #ffffff;
        }
        #player-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        #info-overlay {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 4px;
            font-size: 16px;
            z-index: 10;
            display: none;
        }
    </style>
</head>
<body>

    <div id="player-container"></div>
    <div id="info-overlay">Now Playing: O'Reilly Auto Parts Racing Stream</div>

    <!-- Load YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        var player;
        var playlist = [];
        var currentIndex = 0;
        var configData = {};

        // Load config.json dynamically
        fetch('config.json')
            .then(response => response.json())
            .then(data => {
                configData = data;
                buildRandomizedQueue();
            })
            .catch(err => console.error("Error loading config:", err));

        // Shuffle array to ensure random playback order every time
        function shuffle(array) {
            for (var i = array.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var temp = array[i];
                array[i] = array[j];
                array[j] = temp;
            }
            return array;
        }

        // Build a loop queue: Highlight -> Highlight -> O'Reilly Ad -> Repeat
        function buildRandomizedQueue() {
            var highlights = shuffle([...configData.highlights]);
            var ads = shuffle([...configData.ads]);
            
            playlist = [];
            var adIndex = 0;

            for (var i = 0; i < highlights.length; i++) {
                playlist.push({ type: 'highlight', id: highlights[i] });
                
                // Insert an O'Reilly commercial break after every 2 highlights
                if ((i + 1) % 2 === 0 && ads.length > 0) {
                    playlist.push({ type: 'ad', id: ads[adIndex % ads.length] });
                    adIndex++;
                }
            }

            currentIndex = 0;
            if (player && playlist.length > 0) {
                playCurrentItem();
            }
        }

        // Initialize YouTube Player once API is ready
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player-container', {
                height: '100%',
                width: '100%',
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,
                    'rel': 0,
                    'fs': 0,
                    'iv_load_policy': 3
                },
                events: {
                    'onReady': function(event) {
                        if (playlist.length > 0) {
                            playCurrentItem();
                        }
                    },
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        // CRITICAL: Detects exact moment any video or ad finishes playing (State 0)
        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                currentIndex++;
                if (currentIndex >= playlist.length) {
                    // Re-shuffle and loop infinitely when the playlist finishes
                    buildRandomizedQueue();
                } else {
                    playCurrentItem();
                }
            }
        }

        function playCurrentItem() {
            var item = playlist[currentIndex];
            var overlay = document.getElementById('info-overlay');
            
            if (item.type === 'ad') {
                overlay.innerText = "O'REILLY AUTO PARTS COMMERCIAL";
                overlay.style.display = 'block';
            } else {
                overlay.innerText = "O'Reilly Auto Parts Series Highlights";
                overlay.style.display = 'block';
                // Hide text overlay after 5 seconds so it looks clean like TV
                setTimeout(() => { overlay.style.display = 'none'; }, 5000);
            }

            player.loadVideoById(item.id);
        }

        // Remote Control Bindings coming from MainActivity.kt
        function nextItem() {
            currentIndex = (currentIndex + 1) % playlist.length;
            playCurrentItem();
        }

        function adBreakNow() {
            if (configData.ads && configData.ads.length > 0) {
                var randomAd = configData.ads[Math.floor(Math.random() * configData.ads.length)];
                player.loadVideoById(randomAd);
            }
        }

        function toggleDemo() {
            // Optional demo toggle placeholder
        }
    </script>
</body>
</html>
