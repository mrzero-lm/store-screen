<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>O'Reilly Auto Parts Racing Channel</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            font-family: sans-serif;
            color: #ffffff;
        }
        #player-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        #info-overlay {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 4px;
            font-size: 16px;
            z-index: 10;
            display: none;
        }
    </style>
</head>
<body>

    <div id="player-container"></div>
    <div id="info-overlay">Now Playing: O'Reilly Auto Parts Racing Stream</div>

    <!-- Load YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        var player;
        var playlist = [];
        var currentIndex = 0;
        var configData = {};

        // Load config.json for fallback IDs and commercial pools
        fetch('config.json')
            .then(response => response.json())
            .then(data => {
                configData = data;
                fetchDynamicHighlights();
            })
            .catch(err => {
                console.error("Error loading config:", err);
                fallbackToStatic();
            });

        // Dynamically query YouTube RSS feed for NASCAR highlights to avoid manual curation
        function fetchDynamicHighlights() {
            // Channel feed for official NASCAR uploads (RSS to JSON conversion proxy)
            var channelId = "UCAw54jXw0wN8rQ9e7P3b8YQ"; // NASCAR Official YouTube Feed
            var rssUrl = "https://www.youtube.com/feeds/videos.xml?channel_id=UCU2mLw3gR16uC5K34k4S44g"; 
            
            // Using a public CORS/RSS parser or fallback to smart filtering on config pool
            fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent('https://www.youtube.com/feeds/videos.xml?playlist_id=PLbVOgWDwWJOn3M9cT4T79e3W7j7vT3k0k')}`)
                .then(res => res.json())
                .then(data => {
                    var dynamicIds = [];
                    if (data && data.items) {
                        data.items.forEach(item => {
                            var title = item.title.toLowerCase();
                            // Filter specifically for highlights, recaps, and packaging (skipping shorts and full races)
                            if (title.includes('highlight') || title.includes('recap') || title.includes('extended')) {
                                var videoId = item.link.split('v=')[1];
                                if (videoId) dynamicIds.push(videoId);
                            }
                        });
                    }

                    // If dynamic feed returns items, use them; otherwise fall back to config pool
                    var highlightPool = dynamicIds.length > 0 ? dynamicIds : (configData.highlights || []);
                    buildQueue(highlightPool, configData.ads || []);
                })
                .catch(() => {
                    // Fallback seamlessly if network/RSS proxy fails
                    fallbackToStatic();
                });
        }

        function fallbackToStatic() {
            buildQueue(configData.highlights || [], configData.ads || []);
        }

        function shuffle(array) {
            for (var i = array.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var temp = array[i];
                array[i] = array[j];
                array[j] = temp;
            }
            return array;
        }

        function buildQueue(highlights, ads) {
            var shuffledHighlights = shuffle([...highlights]);
            var shuffledAds = shuffle([...ads]);
            
            playlist = [];
            var adIndex = 0;

            for (var i = 0; i < shuffledHighlights.length; i++) {
                playlist.push({ type: 'highlight', id: shuffledHighlights[i] });
                
                // Intersperse an O'Reilly commercial break after every 2 professional highlights
                if ((i + 1) % 2 === 0 && shuffledAds.length > 0) {
                    playlist.push({ type: 'ad', id: shuffledAds[adIndex % shuffledAds.length] });
                    adIndex++;
                }
            }

            currentIndex = 0;
            if (player && playlist.length > 0) {
                playCurrentItem();
            }
        }

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player-container', {
                height: '100%',
                width: '100%',
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,
                    'rel': 0,
                    'fs': 0,
                    'iv_load_policy': 3
                },
                events: {
                    'onReady': function(event) {
                        if (playlist.length > 0) {
                            playCurrentItem();
                        }
                    },
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        // CRITICAL: Waits for exact state 0 (ENDED) so highlights and commercials play 100% to the end[span_2](start_span)[span_2](end_span)
        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                currentIndex++;
                if (currentIndex >= playlist.length) {
                    fetchDynamicHighlights(); // Refresh and reshuffle a fresh batch automatically
                } else {
                    playCurrentItem();
                }
            }
        }

        function playCurrentItem() {
            if (!playlist[currentIndex]) return;
            var item = playlist[currentIndex];
            var overlay = document.getElementById('info-overlay');
            
            if (item.type === 'ad') {
                overlay.innerText = "O'REILLY AUTO PARTS COMMERCIAL";
                overlay.style.display = 'block';
            } else {
                overlay.innerText = "NASCAR Highlights & Recaps";
                overlay.style.display = 'block';
                setTimeout(() => { overlay.style.display = 'none'; }, 4000);
            }

            player.loadVideoById(item.id);
        }

        // Android Remote Control Bindings
        function nextItem() {
            currentIndex = (currentIndex + 1) % playlist.length;
            playCurrentItem();
        }

        function adBreakNow() {
            if (configData.ads && configData.ads.length > 0) {
                var randomAd = configData.ads[Math.floor(Math.random() * configData.ads.length)];
                player.loadVideoById(randomAd);
            }
        }

        function toggleDemo() {}
    </script>
</body>
</html>
