<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>O'Reilly Auto Parts Racing Channel</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            font-family: sans-serif;
            color: #ffffff;
        }
        #player-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        /* Corner Logo Overlay */
        #corner-logo {
            position: absolute;
            top: 25px;
            right: 25px;
            width: 140px;
            height: auto;
            z-index: 20;
            opacity: 0.9;
            pointer-events: none;
        }
        /* Info Overlay */
        #info-overlay {
            position: absolute;
            bottom: 30px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            border-left: 4px solid #00843D;
            padding: 10px 15px;
            border-radius: 4px;
            font-size: 16px;
            z-index: 10;
            display: none;
        }
        /* Green Progress Bar at Bottom */
        #progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            z-index: 30;
        }
        #progress-bar {
            width: 0%;
            height: 100%;
            background-color: #00843D; /* O'Reilly Green */
            transition: width 0.2s linear;
        }
    </style>
</head>
<body>

    <div id="player-container"></div>
    <img id="corner-logo" src="logo.png" alt="O'Reilly Logo">
    <div id="info-overlay">O'Reilly Auto Parts Racing Stream</div>
    
    <div id="progress-container">
        <div id="progress-bar"></div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        var player;
        var races = [];
        var ads = [];
        var raceIndex = 0;
        var adIndex = 0;

        var isPlayingAd = false;
        var savedRaceTime = 0;
        var secondsSinceLastAd = 0;
        var AD_INTERVAL_SECONDS = 300; // 5 minutes (300 seconds)
        var progressInterval;

        // Built-in default list (overridden if config.json loads)
        var defaultConfig = {
            highlights: [
                "calcJQMokVI", "4m_-zPPu2cY", "lAuO92kIj2c", "rcnmoQkhzQM",
                "oe1_LpC0QsI", "ks7n8cbr2AU", "GWMuNWlj7Xg", "7M50zXoo0DM",
                "RtvqKZ8F5kM", "HGSSWkl1tIw", "V0gRpA8Ci20", "sBwRDx0_Mdw",
                "pARoSj_HuRM", "aFpsWhljrkk", "9sL61Q1vmPo", "Hq1V6sDUnGs"
            ],
            ads: [
                "sGSZt-1V6qk", "u_m-ZNZE0MQ", "vKUhgoVfSpY", "-wEhkR8SQPs",
                "iG3b56k62iA", "i4O4wBP8EoQ", "8kyZrzUSW64", "6L951Wh61ss"
            ]
        };

        fetch('config.json')
            .then(response => response.json())
            .then(data => {
                var loadedRaces = (data.highlights && data.highlights.length > 0) ? data.highlights : defaultConfig.highlights;
                var loadedAds = (data.ads && data.ads.length > 0) ? data.ads : defaultConfig.ads;
                initLists(loadedRaces, loadedAds);
            })
            .catch(err => {
                initLists(defaultConfig.highlights, defaultConfig.ads);
            });

        function shuffle(array) {
            var currentIndex = array.length, temporaryValue, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex -= 1;
                temporaryValue = array[currentIndex];
                array[currentIndex] = array[randomIndex];
                array[randomIndex] = temporaryValue;
            }
            return array;
        }

        function initLists(raceList, adList) {
            races = shuffle([...raceList]);
            ads = shuffle([...adList]);
            raceIndex = 0;
            adIndex = 0;
            if (player && typeof player.loadVideoById === 'function') {
                startOrResumeRace();
            }
        }

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player-container', {
                height: '100%',
                width: '100%',
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,
                    'rel': 0,
                    'fs': 0,
                    'iv_load_policy': 3
                },
                events: {
                    'onReady': function(event) {
                        if (races.length > 0) {
                            startOrResumeRace();
                        }
                    },
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }

        function showBanner(text) {
            var overlay = document.getElementById('info-overlay');
            overlay.innerText = text;
            overlay.style.display = 'block';
            setTimeout(() => { overlay.style.display = 'none'; }, 4000);
        }

        function startOrResumeRace() {
            if (races.length === 0) return;
            isPlayingAd = false;
            secondsSinceLastAd = 0;
            document.getElementById('progress-bar').style.width = '0%';

            var currentRaceId = races[raceIndex];
            if (savedRaceTime > 0) {
                showBanner("Resuming Race Coverage...");
                player.loadVideoById({
                    videoId: currentRaceId,
                    startSeconds: savedRaceTime
                });
            } else {
                showBanner("O'Reilly Auto Parts Racing Stream");
                player.loadVideoById(currentRaceId);
            }
        }

        function triggerCommercialBreak() {
            if (ads.length === 0) return;
            if (!isPlayingAd && player && typeof player.getCurrentTime === 'function') {
                var currentTime = Math.floor(player.getCurrentTime());
                if (currentTime > 0) {
                    savedRaceTime = currentTime;
                }
            }

            isPlayingAd = true;
            secondsSinceLastAd = 0;
            document.getElementById('progress-bar').style.width = '0%';

            var currentAdId = ads[adIndex];
            adIndex++;
            if (adIndex >= ads.length) {
                ads = shuffle([...ads]);
                adIndex = 0;
            }

            showBanner("O'REILLY AUTO PARTS COMMERCIAL BREAK");
            player.loadVideoById(currentAdId);
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                startProgressTracker();
            } else {
                stopProgressTracker();
            }

            // Wait for 100% completion of commercial or race
            if (event.data === YT.PlayerState.ENDED) {
                stopProgressTracker();
                if (isPlayingAd) {
                    // Commercial finished -> seamlessly resume the race where we left off
                    startOrResumeRace();
                } else {
                    // Race finished naturally -> reset timestamp, advance to next race, and run an ad break
                    savedRaceTime = 0;
                    raceIndex++;
                    if (raceIndex >= races.length) {
                        races = shuffle([...races]);
                        raceIndex = 0;
                    }
                    triggerCommercialBreak();
                }
            }
        }

        function onPlayerError(event) {
            stopProgressTracker();
            if (isPlayingAd) {
                // If an old commercial fails to load, jump right back into the race at the saved timestamp
                startOrResumeRace();
            } else {
                // If a race video is unavailable, skip to the next race
                savedRaceTime = 0;
                raceIndex = (raceIndex + 1) % races.length;
                startOrResumeRace();
            }
        }

        function startProgressTracker() {
            stopProgressTracker();
            progressInterval = setInterval(function() {
                if (player && typeof player.getCurrentTime === 'function') {
                    var current = player.getCurrentTime();
                    var duration = player.getDuration();
                    if (duration > 0) {
                        var percent = (current / duration) * 100;
                        document.getElementById('progress-bar').style.width = percent + '%';
                    }

                    // Count race playback time and trigger commercial every 5 minutes (300s)
                    if (!isPlayingAd) {
                        secondsSinceLastAd++;
                        // Only interrupt if there are at least 15 seconds left in the race clip
                        if (secondsSinceLastAd >= AD_INTERVAL_SECONDS && (duration - current > 15)) {
                            stopProgressTracker();
                            triggerCommercialBreak();
                        }
                    }
                }
            }, 1000);
        }

        function stopProgressTracker() {
            if (progressInterval) {
                clearInterval(progressInterval);
            }
        }

        // Android Remote Control Bindings
        function nextItem() {
            stopProgressTracker();
            if (isPlayingAd) {
                // Skip commercial and resume race
                startOrResumeRace();
            } else {
                // Skip to next race
                savedRaceTime = 0;
                raceIndex = (raceIndex + 1) % races.length;
                startOrResumeRace();
            }
        }

        function adBreakNow() {
            if (!isPlayingAd) {
                stopProgressTracker();
                triggerCommercialBreak();
            }
        }
    </script>
</body>
</html>
