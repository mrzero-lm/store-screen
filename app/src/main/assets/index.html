<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>O'Reilly Auto Parts Racing Channel</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            font-family: sans-serif;
            color: #ffffff;
        }
        #player-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        /* Corner Logo Overlay */
        #corner-logo {
            position: absolute;
            top: 25px;
            right: 25px;
            width: 140px;
            height: auto;
            z-index: 20;
            opacity: 0.9;
            pointer-events: none;
        }
        /* Info Overlay */
        #info-overlay {
            position: absolute;
            bottom: 30px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 4px;
            font-size: 16px;
            z-index: 10;
            display: none;
        }
        /* Green Progress Bar at Bottom */
        #progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            z-index: 30;
        }
        #progress-bar {
            width: 0%;
            height: 100%;
            background-color: #00843D; /* O'Reilly Green */
            transition: width 0.2s linear;
        }
    </style>
</head>
<body>

    <div id="player-container"></div>
    <img id="corner-logo" src="logo.png" alt="O'Reilly Logo">
    <div id="info-overlay">O'Reilly Auto Parts Racing Stream</div>
    
    <div id="progress-container">
        <div id="progress-bar"></div>
    </div>

    <!-- Load YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        var player;
        var playlist = [];
        var currentIndex = 0;
        var configData = {};
        var progressInterval;

        // Load your local config.json file
        fetch('config.json')
            .then(response => response.json())
            .then(data => {
                configData = data;
                buildRandomizedQueue();
            })
            .catch(err => console.error("Error loading config:", err));

        // Shuffle array for random playback order
        function shuffle(array) {
            for (var i = array.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var temp = array[i];
                array[i] = array[j];
                array[j] = temp;
            }
            return array;
        }

        // Build continuous queue
        function buildRandomizedQueue() {
            var highlights = shuffle([...(configData.highlights || [])]);
            var ads = shuffle([...(configData.ads || [])]);
            
            playlist = [];
            var adIndex = 0;

            for (var i = 0; i < highlights.length; i++) {
                playlist.push({ type: 'highlight', id: highlights[i] });
                
                if ((i + 1) % 2 === 0 && ads.length > 0) {
                    playlist.push({ type: 'ad', id: ads[adIndex % ads.length] });
                    adIndex++;
                }
            }

            currentIndex = 0;
            if (player && playlist.length > 0) {
                playCurrentItem();
            }
        }

        // Initialize YouTube Player
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player-container', {
                height: '100%',
                width: '100%',
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,
                    'rel': 0,
                    'fs': 0,
                    'iv_load_policy': 3
                },
                events: {
                    'onReady': function(event) {
                        if (playlist.length > 0) {
                            playCurrentItem();
                        }
                    },
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                startProgressTracker();
                var overlay = document.getElementById('info-overlay');
                var item = playlist[currentIndex];
                
                if (item && item.type === 'ad') {
                    overlay.innerText = "O'REILLY AUTO PARTS COMMERCIAL";
                } else {
                    overlay.innerText = "O'Reilly Auto Parts Racing Stream";
                }
                overlay.style.display = 'block';
                setTimeout(() => { overlay.style.display = 'none'; }, 4000);
            } else {
                stopProgressTracker();
            }

            // CRITICAL: Plays 100% to the end
            if (event.data === YT.PlayerState.ENDED) {
                currentIndex++;
                if (currentIndex >= playlist.length) {
                    buildRandomizedQueue();
                } else {
                    playCurrentItem();
                }
            }
        }

        function startProgressTracker() {
            stopProgressTracker();
            progressInterval = setInterval(function() {
                if (player && typeof player.getCurrentTime === 'function') {
                    var current = player.getCurrentTime();
                    var duration = player.getDuration();
                    if (duration > 0) {
                        var percent = (current / duration) * 100;
                        document.getElementById('progress-bar').style.width = percent + '%';
                    }
                }
            }, 500);
        }

        function stopProgressTracker() {
            if (progressInterval) {
                clearInterval(progressInterval);
            }
        }

        function playCurrentItem() {
            if (!playlist[currentIndex]) return;
            var item = playlist[currentIndex];
            player.loadVideoById(item.id);
        }

        // Android Remote Control Bindings
        function nextItem() {
            currentIndex = (currentIndex + 1) % playlist.length;
            playCurrentItem();
        }

        function adBreakNow() {
            if (configData.ads && configData.ads.length > 0) {
                var randomId = configData.ads[Math.floor(Math.random() * configData.ads.length)];
                player.loadVideoById(randomId);
            }
        }
    </script>
</body>
</html>
